<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIA Salvamentos — Red nacional de sedes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E51A1A;
    --red-dark: #B91414;
    --ink: #17181B;
    --paper: #FFFFFF;
    --line: #E4E2DF;
    --muted: #6B6D72;
    --panel: #FAF9F7;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #F2F1EF;
      --paper: #16171A;
      --line: #2C2D30;
      --muted: #9A9CA2;
      --panel: #1D1E21;
    }
  }
  :root[data-theme="dark"] {
    --ink: #F2F1EF;
    --paper: #16171A;
    --line: #2C2D30;
    --muted: #9A9CA2;
    --panel: #1D1E21;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: 'Saira Condensed', 'Nunito Sans', sans-serif; }

  header.hero {
    background: var(--red);
    color: #fff;
    padding: 40px 24px 40px;
    padding-top: calc(40px + env(safe-area-inset-top, 0px));
  }
  .hero-inner { max-width: 880px; margin: 0 auto; }
  .logo-row { display: flex; align-items: center; margin-bottom: 22px; }
  .logo-row img { height: 44px; width: auto; display: block; }
  h1.display {
    font-size: clamp(40px, 8vw, 68px);
    font-weight: 700;
    line-height: 0.96;
    margin: 0 0 18px;
    letter-spacing: -0.01em;
  }
  .hero-stats {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.35);
    padding-top: 20px;
  }
  .stat { min-width: 110px; }
  .stat b {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
  }
  .stat span { font-size: 13px; opacity: 0.9; }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .region {
    margin-bottom: 8px;
  }
  .region-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 22px 0 10px;
    border-bottom: 2px solid var(--ink);
  }
  .region-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .region-head .count { font-size: 13px; color: var(--muted); }

  ul.sede-list { list-style: none; margin: 0; padding: 0; }
  .sede-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .sede-row:last-child { border-bottom: none; }
  .sede-name { font-size: 17px; font-weight: 600; margin: 0 0 3px; }
  .sede-city { font-size: 13.5px; color: var(--muted); margin: 0; }

  .map-link {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    color: var(--ink);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }
  .map-link:hover {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }
  .map-link svg { width: 14px; height: 14px; flex: none; }

  footer {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px 48px;
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 520px) {
    .sede-row { flex-wrap: wrap; }
    .map-link { width: 100%; justify-content: center; }
  }
</style>
</head>
