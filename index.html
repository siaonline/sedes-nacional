  .serif { font-family: var(--serif); }

  /* ---------- Encabezado ---------- */
  header.hero {
    background: var(--red);
    color: #fff;
    padding: 40px 0 42px;
    padding-top: calc(40px + env(safe-area-inset-top, 0px));
  }
  .hero-inner { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .logo-row { display: flex; align-items: center; margin-bottom: 26px; }
  .logo-row img { height: 68px; width: auto; display: block; }
  h1.headline {
    font-family: var(--serif);
    font-size: clamp(40px, 7.4vw, 66px);
    font-weight: 500;
    line-height: 1.02;
    letter-spacing: -0.015em;
    margin: 0 0 18px;
  }
  h1.headline .ln { display: block; }
  .hero-stats {
    display: flex; gap: 30px; flex-wrap: wrap;
    margin-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.35);
    padding-top: 20px;
  }
  .stat { min-width: 110px; }
  .stat b { display: block; font-family: var(--num); font-size: 38px; font-weight: 700; line-height: 1; }
  .stat span { font-size: 13px; opacity: 0.92; }

  /* ---------- Pestañas ---------- */
  .tabs-bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--bar-bg);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    border-bottom: 1px solid var(--line);
  }
  .tabs-inner { max-width: 1040px; margin: 0 auto; padding: 0 24px; display: flex; gap: 30px; overflow-x: auto; }
  .tab {
    appearance: none; background: none; border: 0; cursor: pointer;
    font-family: var(--sans); font-size: 15px; font-weight: 500;
    color: var(--muted);
    padding: 16px 2px 13px;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
    transition: color .2s;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--red); }
  .tab:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  .tab-count {
    font-family: var(--num); font-size: 13px; font-weight: 700;
    padding: 1px 9px; border-radius: 999px;
    background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: 0 0 0 1px var(--glass-ring); color: var(--muted);
  }
  .tab[aria-selected="true"] .tab-count { background: var(--red); border-color: var(--red); box-shadow: none; color: #fff; }

  main { max-width: 1040px; margin: 0 auto; padding: 30px 24px 70px; }

  /* ---------- Buscador y filtros ---------- */
  .toolbar { margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    appearance: none; cursor: pointer; font-family: var(--sans); font-size: 13px; font-weight: 500;
    padding: 8px 16px; border-radius: 999px;
    color: var(--ink);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border); box-shadow: 0 0 0 1px var(--glass-ring);
    transition: transform .2s, background .2s, color .2s;
  }
  .chip:hover { transform: translateY(-1px); background: var(--glass-bg-hover); }
  .chip[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); box-shadow: none; color: #fff; }
  .result-note { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

  /* ---------- Regiones y tarjetas ---------- */
  .region { margin-top: 10px; }
  .region-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 22px 0 10px;
    border-bottom: 1px solid var(--ink);
  }
  .region-head h2 { font-family: var(--serif); font-size: 32px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .region-head .count { font-family: var(--num); font-size: 14px; font-weight: 600; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }

  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    backdrop-filter: blur(18px) saturate(1.15);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 24px 24px 22px;
    box-shadow: 0 0 0 1px var(--glass-ring), 0 12px 34px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.55);
    transition: transform .28s cubic-bezier(.2,.7,.2,1), background .28s, box-shadow .28s;
  }
  .card:hover {
    transform: translateY(-4px);
    background: var(--glass-bg-hover);
    box-shadow: 0 0 0 1px var(--glass-ring), 0 18px 44px var(--glass-shadow-hover), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .sede-name { font-family: var(--serif); font-size: 23px; font-weight: 600; line-height: 1.15; margin: 0 0 4px; letter-spacing: -0.005em; }
  .sede-city { font-size: 13.5px; color: var(--muted); margin: 0; }
  .sede-info {
    display: grid; grid-template-columns: 100px 1fr; gap: 8px 12px;
    margin: 16px 0 0; padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 13.5px; line-height: 1.5;
  }
  .sede-info dt { font-family: var(--num); font-size: 14px; font-weight: 600; color: var(--muted); }
  .sede-info dd { margin: 0; overflow-wrap: anywhere; }
  .sede-info dd div + div { margin-top: 2px; }
  .sede-info a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; transition: color .15s, text-decoration-color .15s; }
  .sede-info a:hover { color: var(--red); text-decoration-color: var(--red); }
  .sede-info a.num { font-family: var(--num); font-size: 15px; font-weight: 600; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
  .card-foot { margin-top: auto; padding-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 20px;
    border: 1.5px solid var(--btn); border-radius: 999px;
    background: var(--btn); color: #fff; text-decoration: none;
    font-family: var(--sans); font-size: 13.5px; font-weight: 500; white-space: nowrap;
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px var(--glass-shadow-hover); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn .arr { transition: transform .2s; }
  .btn:hover .arr { transform: translate(2px, -2px); }

  /* ---------- Dirección nacional ---------- */
  .person-head { display: flex; align-items: center; gap: 14px; }
  .avatar {
    flex: none; width: 54px; height: 54px; border-radius: 50%;
    background: var(--red); color: #fff;
    display: grid; place-items: center;
    font-family: var(--num); font-size: 21px; font-weight: 700; letter-spacing: 0.03em;
    box-shadow: 0 6px 16px rgba(229,26,26,0.28);
  }

  footer { max-width: 1040px; margin: 0 auto; padding: 0 24px 48px; color: var(--muted); font-size: 13px; }

  /* Estado inicial de la animación de entrada */
  .js-intro .hero-inner > *, .js-intro .tabs-bar, .js-intro .toolbar, .js-intro #regions .card { opacity: 0; }

  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 640px) {
    .hero-stats { gap: 16px 22px; }
    .stat { min-width: 0; }
    .stat b { font-size: 32px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; margin-right: -24px; padding-right: 24px; }
    .chip { flex: none; }
    .sede-info { grid-template-columns: 1fr; gap: 2px 0; }
    .sede-info dd { margin-bottom: 8px; }
    .btn { flex: 1 1 auto; justify-content: center; }
    .card { padding: 20px 20px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .card:hover, .btn:hover, .chip:hover, .btn:hover .arr { transform: none; }
  }
</style>
</head>

/* ---------- Sedes ---------- */
const regionsEl = document.getElementById('regions');
const cards = [];

regions.forEach(region => {
  const section = document.createElement('section');
  section.className = 'region';
  section.innerHTML = `<div class="region-head"><h2>${esc(region.name)}</h2><span class="count"></span></div><div class="grid"></div>`;
  const grid = section.querySelector('.grid');

  region.sedes.forEach(s => {
    const d = detalles[s.nombre];
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div>
        <p class="sede-name">${esc(s.nombre)}</p>
        <p class="sede-city">${esc(s.ciudad)}</p>
      </div>
      <dl class="sede-info">
        <dt>Dirección</dt><dd>${esc(d.direccion)}</dd>
        <dt>Jefe de patio</dt><dd>${d.jefes.map(j => `<div>${esc(j)}</div>`).join('')}</dd>
        <dt>Teléfono</dt><dd>${d.telefonos.map(t => `<div><a class="num" href="${telHref(t)}">${esc(t)}</a></div>`).join('')}</dd>
        <dt>Correo</dt><dd>${d.correos.map(c => `<div><a href="mailto:${esc(c)}">${esc(c)}</a></div>`).join('')}</dd>
      </dl>
      <div class="card-foot"><a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Ver en el mapa${ICON.arrow}</a></div>`;
    grid.appendChild(card);
    cards.push({ el: card, region: region.name, section });
  });
  regionsEl.appendChild(section);
});

/* ---------- Filtros ---------- */
const chipsEl = document.getElementById('chips');
const noteEl = document.getElementById('resultNote');
let activeRegion = 'all';

['Todas', ...regions.map(r => r.name)].forEach((label, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.textContent = label;
  b.dataset.region = i === 0 ? 'all' : label;
  b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
  b.addEventListener('click', () => {
    activeRegion = b.dataset.region;
    chipsEl.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b ? 'true' : 'false'));
    applyFilters();
  });
  chipsEl.appendChild(b);
});

function applyFilters() {
  let shown = 0;
  const perSection = new Map();
  cards.forEach(c => {
    const visible = activeRegion === 'all' || c.region === activeRegion;
    c.el.hidden = !visible;
    if (visible) { shown++; perSection.set(c.section, (perSection.get(c.section) || 0) + 1); }
  });
  document.querySelectorAll('#regions .region').forEach(sec => {
    const n = perSection.get(sec) || 0;
    sec.hidden = n === 0;
    sec.querySelector('.count').textContent = n + (n === 1 ? ' sede' : ' sedes');
  });
  noteEl.textContent = activeRegion !== 'all' ? `Mostrando ${shown} de ${cards.length} sedes` : '';
}
applyFilters();

/* ---------- Dirección nacional ---------- */
const dnGrid = document.getElementById('dnGrid');
directivos.forEach(p => {
  const initials = p.nombre.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();

  if (p.direccion) rows.push(`<dt>Dirección</dt><dd>${esc(p.direccion)}</dd>`);

    const t = p.telefonos.map(n => `<div><a class="num" href="${telHref(n)}">${esc(n)}</a></div>`).join('');
    const f = p.fijo ? `<div>${esc(p.fijo)}</div>` : '';
    rows.push(`<dt>Teléfono</dt><dd>${t}${f}</dd>`);
  }
  if (p.correos.length) rows.push(`<dt>Correo</dt><dd>${p.correos.map(c => `<div><a href="mailto:${esc(c)}">${esc(c)}</a></div>`).join('')}</dd>`);
  const actions = [];
  if (p.telefonos.length) actions.push(`<a class="btn" href="${telHref(p.telefonos[0])}">${ICON.phone}Llamar</a>`);
  if (p.correos.length) actions.push(`<a class="btn ghost" href="mailto:${esc(p.correos[0])}">${ICON.mail}Escribir</a>`);
  const card = document.createElement('article');
  card.className = 'card';
  card.innerHTML = `
    <div class="person-head">
      <div class="avatar" aria-hidden="true">${esc(initials)}</div>
      <div><p class="sede-name">${esc(p.nombre)}</p><p class="sede-city">${esc(p.cargo)}</p></div>
    </div>
    ${rows.length ? `<dl class="sede-info">${rows.join('')}</dl>` : ''}
    ${actions.length ? `<div class="card-foot">${actions.join('')}</div>` : ''}`;
  dnGrid.appendChild(card);
});
document.getElementById('countDn').textContent = directivos.length;

/* ---------- Animaciones (Web Animations) ---------- */
const canAnimate = typeof Element.prototype.animate === 'function' && !!window.matchMedia &&
  !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.2,.7,.2,1)';

function rise(els, { delay = 0, stagger = 0, y = 18, blur = 0, duration = 650 } = {}) {
  if (!canAnimate) return;
  [...els].forEach((el, i) => {
    const from = { opacity: 0, transform: `translateY(${y}px)` };
    const to = { opacity: 1, transform: 'none' };
    if (blur) { from.filter = `blur(${blur}px)`; to.filter = 'blur(0)'; }
    el.animate([from, to], { duration, delay: delay + i * stagger, easing: EASE, fill: 'backwards' });
  });
}
function intro() {
  const root = document.documentElement;
  if (!root.classList.contains('js-intro')) return;
  if (canAnimate) {
    document.querySelector('.tabs-bar').animate(
      [{ opacity: 0, transform: 'translateY(-14px)' }, { opacity: 1, transform: 'none' }],
      { duration: 520, easing: EASE, fill: 'backwards' });
    rise(document.querySelectorAll('.hero-inner .logo-row, .hero-inner .hero-stats'), { delay: 80, stagger: 420, y: 14 });
    rise(document.querySelectorAll('.headline .ln'), { delay: 180, stagger: 130, y: 26, blur: 8, duration: 800 });
    rise(document.querySelectorAll('.toolbar'), { delay: 620, y: 14 });
    const first = [...document.querySelectorAll('#regions .card')].filter(c => !c.hidden).slice(0, 10);
    rise(first, { delay: 760, stagger: 80, y: 22 });
  }
  root.classList.remove('js-intro');
}
/* La animación corre cuando las tipografías están listas; si tardan, arranca igual */
let introDone = false;
const startIntro = () => { if (!introDone) { introDone = true; intro(); } };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(startIntro);
setTimeout(startIntro, 1400);

/* ---------- Pestañas ---------- */
const tabEls = [...document.querySelectorAll('.tab')];
function showTab(id, updateHash, animate) {
  tabEls.forEach(t => {
    const on = t.dataset.tab === id;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.tabIndex = on ? 0 : -1;
    document.getElementById('panel-' + t.dataset.tab).hidden = !on;
  });
  if (updateHash) { try { history.replaceState(null, '', '#' + id); } catch (e) { /* sin historial disponible */ } }
  if (animate) {
    const panel = document.getElementById('panel-' + id);
    rise(panel.querySelectorAll('.card'), { stagger: 90, y: 20 });
  }
}
tabEls.forEach((t, i) => {
  t.addEventListener('click', () => { if (t.getAttribute('aria-selected') !== 'true') showTab(t.dataset.tab, true, true); });
  t.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const next = tabEls[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabEls.length) % tabEls.length];
    showTab(next.dataset.tab, true, true); next.focus();
  });
});
const fromHash = () => (location.hash === '#direccion-nacional' ? 'direccion-nacional' : 'sedes');
showTab(fromHash(), false, false);
window.addEventListener('hashchange', () => showTab(fromHash(), false, true));
